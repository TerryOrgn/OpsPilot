name: JOB MySQL integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: job-ci-root
          MYSQL_DATABASE: opspilot_test
          MYSQL_USER: job_ci
          MYSQL_PASSWORD: job-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      VERCEL: '1'
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: job_ci
      MYSQL_PASSWORD: job-ci-only
      MYSQL_DATABASE: opspilot_test
      OPSPILOT_EXPECTED_DATABASE: opspilot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-job.txt
      - name: Initialize disposable test database
        run: |
          set -euo pipefail
          mysql_test() {
            MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USER" --database=opspilot_test "$@"
          }
          test "$(mysql_test --batch --skip-column-names -e 'SELECT DATABASE()')" = opspilot_test
          mysql_test < migrations/001_job_monitor.sql
          mysql_test -e "INSERT INTO JOB_MONITOR_CHECKPOINT (MONITOR_NAME, LAST_SCAN_TIME) VALUES ('JOB_MONITOR', NOW(3))"
      - name: Run JOB acceptance suite
        run: python run_job_acceptance.py
      - name: Verify repository timeout conversion
        env:
          OPSPILOT_DB_NAME: opspilot_test
          OPSPILOT_DB_TIMEOUT_FIXTURE: ci-timeout-fixture
        run: |
          python -m pip install mysql-connector-python==26.10.0
          mysql_test() {
            MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USER" --database=opspilot_test "$@"
          }
          test "$(mysql_test -NBe 'SELECT DATABASE()')" = opspilot_test
          mysql_test -e "INSERT INTO JOB_EXECUTION_LOG (EXECUTION_ID,SYSTEM_ID,JOB_NAME,BUSINESS_DATE,START_TIME,UPDATED_AT,STATUS) VALUES ('ci-timeout-fixture','TEST','CI timeout',CURRENT_DATE(),NOW()-INTERVAL 2 HOUR,NOW()-INTERVAL 2 HOUR,'RUNNING')"
          OPSPILOT_DB_HOST="$MYSQL_HOST" OPSPILOT_DB_PORT="$MYSQL_PORT" OPSPILOT_DB_USER="$MYSQL_USER" OPSPILOT_DB_PASSWORD="$MYSQL_PASSWORD" python test_mysql_job_repository_live.py
